# ============================================================
# FREIGHT MARKET SUMMARY TOOL - CONFIGURATION
# ============================================================
# Edit this file to customize your YouTube channels, podcasts,
# stock tickers, and API keys.
# ============================================================

# --- YouTube Channels ---
# Add the channel URL or channel ID for each freight/trucking channel.
# To find a channel ID: go to the channel page, click "About", and
# look at the URL — it ends with /channel/UC... or /@ChannelHandle.
youtube_channels:
  - name: "FreightWaves"
    channel_handle: "@FreightWavesTV"
  - name: "DAT Freight & Analytics"
    channel_handle: "@DATFreightAndAnalytics"
  - name: "Kevin Hill - The Trucking Industry"
    channel_handle: "@TruckingIndustry"
  - name: "Trucking Podcast"
    channel_handle: "@CDLLife"

# --- Podcast RSS Feeds ---
# Add the RSS feed URL for each podcast you want included.
# To find an RSS feed: search "[podcast name] RSS feed" or check
# the podcast's website. Apple Podcasts links can be converted at
# https://podcastfeeds.io
podcast_feeds:
  - name: "FreightWaves What The Truck"
    rss_url: "https://feeds.megaphone.fm/what-the-truck"
  - name: "Dat iQ Live"
    rss_url: "https://feeds.buzzsprout.com/2136927.rss"

# --- Stock Tickers ---
# Trucking/freight public companies to track for news.
stock_tickers:
  - "ODFL"
  - "KNX"
  - "WERN"
  - "SAIA"
  - "XPO"
  - "CHRW"
  - "JBHT"

# --- API Keys ---
# Replace the placeholder values below with your real keys.
# See README.md for instructions on where to get each key.
api_keys:
  # Claude API key from https://console.anthropic.com/
  anthropic_api_key: "YOUR_ANTHROPIC_API_KEY_HERE"

  # SendGrid API key from https://app.sendgrid.com/settings/api_keys
  sendgrid_api_key: "YOUR_SENDGRID_API_KEY_HERE"

# --- Email Settings ---
email:
  from_email: "freight-summary@yourdomain.com"
  to_email: "you@youremail.com"
  subject_prefix: "Weekly Freight Market Summary"

# --- Whisper Settings ---
# Model size: tiny, base, small, medium, large
# Smaller = faster but less accurate. "base" is a good default.
whisper_model: "base"
